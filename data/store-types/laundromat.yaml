# Laundromat (CA). Drafted 2026-10-20 from laundromat sales (docs/exploration/laundromat.md);
# Rick reviews. Scope (Rick, 2026-10-20): customer laundry and wash-and-fold bulk (department
# laundry), plus vending drinks and snacks reused from the liquor tree. Store operating supplies
# (janitorial, restroom paper) are out of scope.
#
# Priority from the share of CA laundromats (230 that ordered in 12 months) that bought the item,
# counting any approved SKU in data/matches/laundromat.csv: must 30% or more, should 10–30%,
# nice 3–10%. Where the 90-day share is under half or over double the 12-month share (fading,
# discontinued or new), the 90-day share decides. Items under 3% are not carried. The comment on
# each line is the 12-month / 90-day share.
