notes:
  scd.cola.coca-cola-mexican: Must in the LA market.
  scd.lemon-lime.sprite-mexican: Should in the LA market.
  scd.fruit-mexican.squirt: Must in the LA market; paloma mixer, including 2L.
  scd.fruit-mexican.jarritos: The top four flavors (Mandarin, Lime, Tamarind, Grapefruit) are must in the LA market.
  scd.lemon-lime.mountain-dew.diet: The outline gave Diet Mountain Dew no priority; set to nice.
  scd.ginger-ale-club-tonic.canada-dry: Ginger Ale 20oz and Club Soda and Tonic 1L are must as mixers.
  drinks.water.topo-chico: Must in the LA market; mixer.
  drinks.water.value-water: One value still water in every store (guardrail).
  drinks.sports.electrolit: Strawberry, Coconut and Orange Mandarin are must in the LA market.
  drinks.sports.vitaminwater: Carry XXX plus two others.
  drinks.juice.motts-clamato.original: 16oz and 32oz are must for micheladas.
  drinks.michelada.baja-micheladas: All four flavors are must per the department 5 decision (michelada cups stay and are must). Section 2.6 had Original and Hot at should.
  candy-snacks: "Guardrails: checkout counter holds 6 chocolate bars, 4 gums, 2 mints, Blow Pops and 4 Mexican candies minimum. Peg wall: Haribo, Trolli, Sour Patch, Nerds Clusters, one value line. Chip rack: 3 Flamin' Hot items, Doritos, Lay's, Takis."
  candy-snacks.mexican-candy: Priorities will be re-ranked from sales data; every stocked brand stays in the tree.
  candy-snacks.gummy-chewy.now-and-later: LA market staple.
  candy-snacks.nuts-seeds.japanese-peanuts: Must in the LA market.
  candy-snacks.cookies-cakes.gamesa.marias: Should in the LA market.
  candy-snacks.cookies-cakes.bon-appetit: Concha and Danish are should in the LA market.
