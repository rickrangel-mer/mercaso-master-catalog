# Liquor store (LA market). Source: docs/exploration/liquor.md.
# `priority` maps a node id to must | should | nice. A priority covers the node's whole subtree
# unless a descendant sets its own. Every carried leaf must end up with a priority.
#
# How the outline's wording becomes priorities:
# - A variant the outline lists without a priority is nice (department or section default).
# - When a must names one size ("Lemonade 20oz must"), the variant's other sizes are should.
#   When a should names one size, the other sizes are nice.
# - Take-home sizes (1L and up) and cigarette cartons of must variants are should, unless the
#   outline makes them must (Coca-Cola, Pepsi, Sprite, Squirt 2L; Clamato 32oz; water 1L).
# - "LA market" priorities apply as written; the reason is kept in `notes`.
# - state: CA drops every node marked restricted in CA (menthol and flavored tobacco).
store_type: liquor
name: Liquor store
description: >-
  Independent LA-market liquor store. Non-alcoholic scope only: no alcohol, beer or wine,
  no chilled or frozen, no packaged ice. One priority list for all store sizes.
state: CA

