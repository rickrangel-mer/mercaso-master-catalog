        name: Gain
        kind: brand_line
        children:
          - { key: original, name: Original, kind: variant, sizes: [10oz, 25oz] }
          - { key: ultra-oxi-waterfall, name: Ultra Oxi Waterfall, kind: variant, sizes: [10oz] }
      - key: tide
        name: Tide
        kind: brand_line
        note: Tide Original; the Simply line is separate below.
        children:
          - { key: original, name: Original, kind: variant, sizes: [8oz, 10oz, 25oz, 32oz] }
          - { key: original-with-bleach, name: Original with Bleach, kind: variant, sizes: [25oz] }
      - key: tide-simply
        name: Tide Simply
        kind: brand_line
        children:
          - { key: clean-fresh, name: Clean & Fresh, kind: variant, sizes: [10oz] }
          - { key: oxi, name: Oxi, kind: variant, sizes: [10oz, 32oz] }
          - { key: daybreak-fresh, name: Daybreak Fresh, kind: variant, sizes: [25oz, 32oz] }
