    kind: category
    children:
      - key: suavitel
        name: Suavitel
        kind: brand_line
        children:
          - { key: fresca-primavera, name: Fresca Primavera, kind: variant, sizes: [450ml, 850ml, 1l, 46oz, 8-5l] }
