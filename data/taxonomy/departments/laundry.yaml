# Laundry for laundromats. Source: docs/exploration/laundromat.md (drafted 2026-10-20 from the
# trailing-12-month laundromat sales; Rick reviews).
# Branded: brand line -> variant (scent) -> size, like soft drinks. Laundromat customers ask for
# Tide, Gain, Suavitel, Downy or Ariel by name, and the top items reach 50–79% of laundromats.
# Sizes are retail units; the case pack lives on the match row (rule 3). Bulk sizes are the ones
# a laundromat uses itself for wash-and-fold. The liquor store type carries its own small laundry
# shelf (household.laundry) and does not include this department.
# Powder and bar sizes name their weight in ounces so the matcher can check them. Where one brand
# spans categories, the line name carries the product type ("Tide Powder", "Gain Dryer Sheets") so
# the matcher keeps detergent, softener and sheets apart.
key: laundry
name: Laundry
kind: department
size_classes:
  single_load: Single load or single use, sold at the counter or from the vending machine
  retail: Small retail bottle, bag or box (a few loads), sold at the counter
  bulk: Wash-and-fold bulk, used by the laundromat itself
size_defs:
  # Liquids (detergent, softener, bleach, stain remover)
  8oz: { name: 8oz bottle, size_class: single_load, container: bottle, volume_ml: 237 }
  10oz: { name: 10oz bottle, size_class: single_load, container: bottle, volume_ml: 296 }
  11oz: { name: 11oz bottle, size_class: single_load, container: bottle, volume_ml: 325 }
  360ml: { name: 360ml / 12oz bottle, size_class: single_load, container: bottle, volume_ml: 360 }
  13-5oz: { name: 13.5oz bottle, size_class: single_load, container: bottle, volume_ml: 399 }
  400ml-pouch: { name: 400ml pouch, size_class: single_load, container: pouch, volume_ml: 400 }
  450ml: { name: 450ml bottle, size_class: single_load, container: bottle, volume_ml: 450 }
  16oz: { name: 16oz bottle, size_class: retail, container: bottle, volume_ml: 473 }
  16-9oz: { name: 16.9oz / 500ml bottle, size_class: retail, container: bottle, volume_ml: 500 }
  567ml: { name: 567ml / 19oz bottle, size_class: retail, container: bottle, volume_ml: 567 }
  22oz: { name: 22oz bottle, size_class: retail, container: bottle, volume_ml: 651 }
  24oz: { name: 24oz bottle, size_class: retail, container: bottle, volume_ml: 710 }
  700ml: { name: 700ml bottle, size_class: retail, container: bottle, volume_ml: 700 }
  25oz: { name: 25oz bottle, size_class: retail, container: bottle, volume_ml: 739 }
  750ml: { name: 24.7–27oz bottle (730–800ml), size_class: retail, container: bottle }
  850ml: { name: 850ml bottle, size_class: retail, container: bottle, volume_ml: 850 }
  32oz: { name: 31–34oz bottle, size_class: retail, container: bottle }
  1l: { name: 33oz / 1L bottle, size_class: retail, container: bottle, volume_ml: 1000 }
  43oz: { name: 43oz bottle, size_class: retail, container: bottle, volume_ml: 1272 }
  46oz: { name: 46oz bottle, size_class: retail, container: bottle, volume_ml: 1360 }
  64oz: { name: 64oz bottle, size_class: bulk, container: bottle, volume_ml: 1893 }
  2-6l: { name: 88–95oz bottle (2.6–2.8L), size_class: bulk, container: bottle }
  96oz: { name: 96oz jug, size_class: bulk, container: jug, volume_ml: 2839 }
  3l: { name: 3L bottle, size_class: bulk, container: bottle, volume_ml: 3000 }
  121oz: { name: 121oz jug, size_class: bulk, container: jug, volume_ml: 3578 }
  1gal: { name: 1 gallon jug, size_class: bulk, container: jug, volume_ml: 3785 }
  8-5l: { name: 8.5L jug, size_class: bulk, container: jug, volume_ml: 8500 }
  # Powders and bars
  single-use: { name: Single-use packet (1–1.4oz), size_class: single_load }
  218g: { name: 218g box (7.7oz), size_class: single_load }
  250g: { name: 250g bag (8.8oz), size_class: single_load }
  350g: { name: 350g bag (12.3oz), size_class: retail }
  500g: { name: 500g bag (17.6oz), size_class: retail }
  690g: { name: 690g bag (24.3oz), size_class: retail }
  850g: { name: 850g bag (30oz), size_class: retail }
  1kg: { name: 1kg bag (35.3oz), size_class: retail }
  1-5kg: { name: 1.5kg bag (52.9oz), size_class: retail }
  5kg: { name: 5kg bag (176oz), size_class: bulk }
  8-5kg: { name: 8.5kg bag or bucket (300oz), size_class: bulk }
  10kg: { name: 10kg bag (353oz), size_class: bulk }
  7oz-bar: { name: 7oz bar (200g), size_class: single_load }
  14oz-bar: { name: 14oz bar (400g), size_class: retail }
  # Dryer sheets
  15ct: { name: 15ct box, size_class: single_load, unit_count: 15 }
  16ct: { name: 16ct tub, size_class: retail, unit_count: 16 }
  18ct: { name: 18ct box, size_class: single_load, unit_count: 18 }
  20ct: { name: 20ct box, size_class: single_load, unit_count: 20 }
  34ct: { name: 34ct box, size_class: retail, unit_count: 34 }
  36ct: { name: 36ct box, size_class: retail, unit_count: 36 }
children:
  # L.1 Liquid detergent
  - key: detergent-liquid
    name: Liquid detergent
    kind: category
    children:
