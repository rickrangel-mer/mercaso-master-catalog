  # L.6 Laundry bags & accessories
  - key: accessories
    name: Laundry bags & accessories
    kind: category
    children:
      - key: laundry-bag
        name: Laundry bag
        kind: assortment_slot
        match_terms: ["laundry bag"]
        target_count: { min: 1, max: 2 }
        note: Zipper bag or printed tote, sold at the counter.
