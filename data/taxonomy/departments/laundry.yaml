      - key: foca
        name: Foca
        kind: brand_line
        sizes: [16oz, 1l]
        children:
          - { key: original, name: Original, kind: variant }
      - key: roma
        name: Roma
        kind: brand_line
        sizes: [16oz, 1l]
        children:
          - { key: original, name: Original, kind: variant }
      - key: ariel
        name: Ariel
        kind: brand_line
        children:
          - { key: revitacolor, name: Revitacolor, kind: variant, sizes: [400ml-pouch] }
      - key: ace
        name: Ace
        kind: brand_line
        sizes: [750ml]
        children:
          - { key: regular, name: Regular, kind: variant }
      - key: zote
        name: Zote
        kind: brand_line
        note: Liquid laundry soap.
        sizes: [1l]
        children:
          - { key: pink, name: Pink, kind: variant }
      - key: blanca-nieves
        name: Blanca Nieves
        kind: brand_line
