# Soft drinks (SCD). Source: docs/exploration/liquor.md section 1.
# Branded department: brand line -> variant -> size. Sizes are retail units (rule 3);
# case pack lives on the match row. Priorities live in data/store-types/*.yaml.
key: scd
name: Soft drinks
kind: department
size_classes:
  single: Grab-and-go, cold box (12oz can to 20oz bottle)
  take_home: Take-home bottles, 1L to 3L
size_defs:
  12oz-can: { name: 12oz can, size_class: single, container: can, volume_ml: 355 }
  16oz-can: { name: 16oz can, size_class: single, container: can, volume_ml: 473 }
  12oz-glass: { name: 12oz / 355ml glass, size_class: single, container: glass bottle, volume_ml: 355 }
  12-5oz-glass: { name: 12.5oz glass, size_class: single, container: glass bottle, volume_ml: 370 }
  500ml: { name: 16.9oz / 500ml bottle, size_class: single, container: bottle, volume_ml: 500 }
  500ml-glass: { name: 500ml glass, size_class: single, container: glass bottle, volume_ml: 500 }
  20oz: { name: 20oz bottle, size_class: single, container: bottle, volume_ml: 591 }
  1l: { name: 1L bottle, size_class: take_home, container: bottle, volume_ml: 1000 }
  1-25l: { name: 1.25L bottle, size_class: take_home, container: bottle, volume_ml: 1250 }
  1-5l: { name: 1.5L bottle, size_class: take_home, container: bottle, volume_ml: 1500 }
  2l: { name: 2L bottle, size_class: take_home, container: bottle, volume_ml: 2000 }
  3l: { name: 3L bottle, size_class: take_home, container: bottle, volume_ml: 3000 }
children:
  # 1.1 Cola
  - key: cola
    name: Cola
    kind: category
    note: Dr Pepper stays under Cola; it competes for the same facings.
    children:
      - key: coca-cola
        name: Coca-Cola
        kind: brand_line
        sizes: [12oz-can, 20oz, 2l]
        children:
          - { key: classic, name: Classic, kind: variant }
          - { key: zero-sugar, name: Zero Sugar, kind: variant }
          - { key: diet, name: Diet Coke, kind: variant }
          - { key: cherry, name: Cherry, kind: variant }
          - { key: vanilla, name: Vanilla, kind: variant }
          - { key: caffeine-free, name: Caffeine-Free, kind: variant }
      - key: coca-cola-mexican
        name: Coca-Cola Mexican
        kind: brand_line
        note: Glass bottle, cane sugar.
        sizes: [12oz-glass, 500ml-glass]
        children:
          - { key: classic, name: Classic, kind: variant }
      - key: pepsi
        name: Pepsi
        kind: brand_line
        sizes: [12oz-can, 20oz, 2l]
        children:
          - { key: original, name: Original, kind: variant }
          - { key: zero-sugar, name: Zero Sugar, kind: variant }
          - { key: diet, name: Diet Pepsi, kind: variant }
          - { key: wild-cherry, name: Wild Cherry, kind: variant }
      - key: dr-pepper
        name: Dr Pepper
        kind: brand_line
        sizes: [12oz-can, 20oz, 2l]
        children:
          - { key: original, name: Original, kind: variant }
          - { key: zero-sugar, name: Zero Sugar, kind: variant }
          - { key: diet, name: Diet Dr Pepper, kind: variant }
          - { key: cherry, name: Cherry, kind: variant }
      - key: shasta
        name: Shasta
        kind: brand_line
        note: >-
          Value line with 21 items in the old sheet, with flavors across lemon-lime, fruit and
          root beer. Only the colas are encoded; add the other flavors after the sales check.
        verify: sales
        sizes: [12oz-can, 2l, 3l]
        children:
          - { key: cola, name: Cola, kind: variant }
          - { key: diet-cola, name: Diet Cola, kind: variant }
      - key: rc-cola
        name: RC Cola
        kind: brand_line
        sizes: [12oz-can, 20oz]
        children:
          - { key: original, name: Original, kind: variant }

