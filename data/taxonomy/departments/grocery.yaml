# Grocery staples. Source: docs/exploration/liquor.md section 8.
# Mostly assortment: a 9pm convenience top-up, small sizes, one or two options per slot.
# Branded exceptions (customers ask by name): hot sauce, Tajín and chamoy.
# Out of scope: chilled and frozen, bread.
key: grocery
name: Grocery staples
kind: department
size_classes:
  small: Single-use or small size (liquor-store default)
  regular: Standard retail size
  bulk: Club or multi-pack (markets only)
size_defs:
  2oz: { name: 2oz bottle, size_class: small, container: bottle }
  4oz: { name: 4oz bottle, size_class: small, container: bottle }
  0-35oz: { name: 0.35oz mini, size_class: small }
  5oz: { name: 5oz, size_class: small }
  10oz: { name: 10oz bottle, size_class: small, container: bottle }
  12-5oz: { name: 12.5oz bottle, size_class: small, container: bottle }
  bottle: { name: Standard bottle, size_class: small, container: bottle }
children:
  # 8.1 Instant meals
  - key: instant-meals
    name: Instant meals
    kind: category
    children:
      - key: ramen-cup
        name: Ramen cup / bowl
        kind: assortment_slot
        match_terms: ["cup", "bowl"]
        target_count: { min: 4, max: 6 }
        brand_hints: [Maruchan, Nissin Cup Noodles, Nongshim, Paldo, Tapatio Big Bowl, Samyang Buldak]
      - key: ramen-packet
        name: Ramen packet
        kind: assortment_slot
        match_terms: ["ramen noodle soup", "top ramen", "noodle soup,"]
        target_count: { min: 2, max: 2 }
        brand_hints: [Maruchan, Nissin Top Ramen, Samyang]
      - key: canned-chili-pasta
        name: Canned chili / pasta
        kind: assortment_slot
        target_count: { min: 1, max: 2 }
        brand_hints: [Hormel, Chef Boyardee, Dinty Moore]
      - key: vienna-sausage
        name: Vienna sausage
        kind: assortment_slot
        target_count: { min: 1, max: 1 }
        brand_hints: [Libby's]
      - key: spam
        name: Spam / luncheon meat
        kind: assortment_slot
        match_terms: ["spam"]
        target_count: { min: 1, max: 1 }
        brand_hints: [Hormel]
      - key: canned-soup
        name: Canned soup
        kind: assortment_slot
        target_count: { min: 1, max: 2 }
        brand_hints: [Campbell's, Juanita's, Maggi]
        note: Juanita's Menudo is the second seller (5.5% of stores) after Campbell's Chicken Noodle.
      - key: mac-cheese-cup
        name: Mac & cheese cup
        kind: assortment_slot
        target_count: { min: 1, max: 1 }
        brand_hints: [Kraft]

  # 8.2 Seasonings, hot sauce & condiments
  - key: seasonings
    name: Seasonings, hot sauce & condiments
    kind: category
    children:
      - key: tajin
        name: Tajín
        kind: brand_line
        note: >-
          Department 5 cross-references Tajín and chamoy. The outline's "Fruit" is the 5oz
          Clásico, sold as "Fruit and Snack Seasoning" (sales cross-check 1.12).
        children:
          - { key: clasico, name: Clásico, kind: variant, sizes: [5oz] }
          - { key: mini, name: Clásico Mini, kind: variant, sizes: [0-35oz] }
          - { key: chamoy, name: Chamoy, kind: variant, sizes: [bottle] }
      - key: mega
        name: Mega
        kind: brand_line
        sizes: [bottle]
        children:
          - { key: chamoy, name: Chamoy, kind: variant }
      - key: hot-sauce
        name: Hot sauce
        kind: subcategory
        note: Sizes confirmed against Mercaso stock (sales cross-check 6.1).
        children:
          - key: tapatio
            name: Tapatío
            kind: brand_line
            sizes: [5oz, 10oz]
            children:
              - { key: original, name: Original, kind: variant }
          - key: valentina
            name: Valentina
            kind: brand_line
            sizes: [12-5oz]
            children:
              - { key: original, name: Original, kind: variant }
          - key: el-yucateco
            name: El Yucateco
            kind: brand_line
            sizes: [4oz]
            children:
              - { key: red-habanero, name: Red Habanero, kind: variant }
          - key: cholula
            name: Cholula
            kind: brand_line
            sizes: [5oz]
            children:
              - { key: original, name: Original, kind: variant }
          - key: tabasco
            name: Tabasco
            kind: brand_line
            sizes: [2oz]
            children:
              - { key: original, name: Original, kind: variant }
      - key: salt
        name: Salt
        kind: assortment_slot
        target_count: { min: 1, max: 1 }
        brand_hints: [Morton, Sal Bahía]
      - key: pepper
        name: Pepper
        kind: assortment_slot
        target_count: { min: 1, max: 1 }
        brand_hints: [McCormick]
      - key: seasoning-blend
        name: Seasoning blend
        kind: assortment_slot
        target_count: { min: 1, max: 1 }
        brand_hints: [Knorr, Lawry's]
        note: Knorr chicken bouillon, Lawry's.
      - key: mayo
        name: Mayonnaise
        kind: assortment_slot
        match_terms: ["mayonnaise"]
        target_count: { min: 1, max: 1 }
        brand_hints: [Best Foods, McCormick]
      - key: ketchup
        name: Ketchup
        kind: assortment_slot
        target_count: { min: 1, max: 1 }
        brand_hints: [Del Monte, Hunt's, Heinz]
      - key: mustard
        name: Mustard
        kind: assortment_slot
        target_count: { min: 1, max: 1 }
        brand_hints: [French's]
      - key: salad-dressing
        name: Salad dressing
        kind: assortment_slot
        target_count: { min: 1, max: 1 }
        brand_hints: [Wish-Bone]
      - key: soy-sauce
        name: Soy sauce
        kind: assortment_slot
        target_count: { min: 1, max: 1 }
        brand_hints: [Kikkoman]
      - key: lemon-lime-juice
        name: Lemon & lime juice
        kind: assortment_slot
        match_terms: ["lemon juice", "lime juice"]
        target_count: { min: 1, max: 2 }
        size_class: [small]
        brand_hints: [ReaLemon, ReaLime, California Wedge]
        note: A drink mixer as much as a grocery item; linked from mixers. ReaLemon 2.5oz reaches 10.9% of stores.
      - key: beer-salt
        name: Beer salt
        kind: assortment_slot
        match_terms: ["beer salt"]
        target_count: { min: 1, max: 1 }
        size_class: [small]
        brand_hints: [Twang]
        note: Linked from mixers.
      - key: dried-shrimp
        name: Dried shrimp
        kind: assortment_slot
        match_terms: ["dried shrimp", "whole shrimp"]
        target_count: { min: 1, max: 1 }
        size_class: [small]
        brand_hints: [Lupag]
        note: A botana with beer.

