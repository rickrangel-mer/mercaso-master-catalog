        children:
          - { key: charcoal, name: Charcoal, kind: assortment_slot, target_count: { min: 1, max: 1 }, brand_hints: [Kingsford] }
          - { key: charcoal-lighter-fluid, name: Charcoal lighter fluid, kind: assortment_slot, target_count: { min: 1, max: 1 }, brand_hints: [Kingsford] }
