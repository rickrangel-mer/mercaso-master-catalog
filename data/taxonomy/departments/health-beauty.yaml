# Health & beauty. Source: docs/exploration/liquor.md section 7.
# Assortment, same slot rules as department 6. The liquor-store version is one "trial size /
# emergency" rack, so every slot is size_class small. Male enhancement products are out.
key: health-beauty
name: Health & beauty
kind: department
size_classes:
  small: Single-use or trial size (liquor-store default)
  regular: Standard retail size
  bulk: Club or multi-pack (markets only)
children:
