  - key: medicine
    name: Medicine (OTC)
    kind: category
    children:
      - key: pain-reliever
        name: Pain reliever (acetaminophen, ibuprofen)
        kind: assortment_slot
        target_count: { min: 2, max: 2 }
        size_class: [small]
        brand_hints: [Tylenol, Advil, Aleve]
        note: Single-dose 2-packs.
      - key: antacid
        name: Antacid
        kind: assortment_slot
